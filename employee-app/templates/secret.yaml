{{- if .Values.secrets.enabled }}

apiVersion: v1
kind: Secret

metadata:
  name: {{ include "employee.name" . }}-secret
  namespace: {{ include "employee.namespace" . }}

type: Opaque

stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

{{- end }}
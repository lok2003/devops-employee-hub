name: React JS Build 
on:
  push:
    branches:
      - main 
jobs:
  build:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Get the code 
        uses: actions/checkout@v4 
      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci 

      - name: Build React Application 
        run: npm run build 
      
      - name: Upload Build Artifacts 
        uses: actions/upload-artifact@v4 
        with:
          name: build-output 
          path: dist/


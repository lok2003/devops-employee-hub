name: React CI/CD 
on:
  push:
    branches:
      - main 
jobs:
  build:
    runs-on: ubuntu-latest 
    
    steps:
      - name: Get the code 
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci 

      - name: Build React Application 
        run: npm run build 
      
      - name: Upload Build Artifacts 
        uses: actions/upload-artifact@v4 
        with:
          name: build-output 
          path: dist/
  docker:
    needs: build 
    runs-on: ubuntu-latest 
    steps:
      - name: Get the Code 
        uses: actions/checkout@v4 
      
      - name: Login to DockerHub 
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Docker Image 
        run: |
           docker build \
            -t lok2003/react-app:${{ github.sha }} \
            -t lok2003/react-app:latest \
            .  
      - name: Push Docker Image
        run: |
           docker push lok2003/react-app:${{ github.sha }}
           docker push lok2003/react-app:latest 
           